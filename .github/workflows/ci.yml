name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, typecheck, unit tests, build, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit + integration tests (with coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          # No GROQ_API_KEY in CI — this proves the app builds and the
          # fallback-generation path works even without AI credentials.
          GROQ_API_KEY: ""

      - name: Run e2e tests (Playwright, system Chrome)
        run: npx playwright test --project=chromium
        # ubuntu-latest ships google-chrome-stable preinstalled, so this
        # doesn't need `playwright install` to download a browser.

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
